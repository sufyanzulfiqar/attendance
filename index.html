<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>AB Building and Co – Attendance</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<style>
  :root { --navy:#1f3a5f; --green:#1e9e4a; --red:#d93b30; --ot:#c25e00; --bg:#f2f4f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#1d1d1f; }
  .wrap { max-width:480px; margin:0 auto; min-height:100vh; background:#fff; }
  .top { background:var(--navy); color:#fff; padding:18px 18px 14px; }
  .top h1 { margin:0; font-size:20px; }
  .top small { display:block; opacity:.85; font-size:14px; margin-top:3px; }
  .in { padding:18px; display:flex; flex-direction:column; gap:12px; }
  label { font-size:14px; color:#555; }
  input[type=time] { min-height:52px; -webkit-appearance:none; appearance:none; }
  select, input { width:100%; border:1px solid #c9ced6; border-radius:10px; padding:13px; font-size:18px; background:#fafafa; font-family:inherit; }
  button { font-family:inherit; cursor:pointer; }
  .btn { width:100%; border:0; border-radius:14px; padding:20px; font-size:24px; font-weight:800; color:#fff; }
  .btn:disabled { opacity:.5; }
  .g { background:var(--green); } .r { background:var(--red); }
  .b { background:var(--navy); font-size:18px; padding:15px; }
  .ghost { background:#fff; color:var(--navy); border:1px solid #c9ced6; font-size:15px; padding:12px; border-radius:12px; font-weight:600; }
  .st { background:#eef6ff; border-radius:10px; padding:12px; font-size:16px; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:15px; padding:8px 0; border-bottom:1px solid #eee; }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; border:1px solid #c9ced6; border-radius:10px; padding:11px; font-size:16px; background:#fff; }
  .seg button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .ot { color:var(--ot); font-weight:700; }
  .warn { color:var(--red); font-size:14px; line-height:1.5; }
  .err { color:var(--red); font-size:15px; min-height:1em; }
  .ok { color:var(--green); font-size:15px; }
  .muted { color:#777; font-size:14px; }
  .link { background:none; border:0; color:var(--navy); text-decoration:underline; font-size:14px; padding:4px 0; align-self:flex-start; }
  .hide { display:none !important; }
  .tbl { width:100%; border-collapse:collapse; font-size:15px; }
  .tbl th, .tbl td { padding:9px 4px; border-bottom:1px solid #eee; text-align:right; white-space:nowrap; }
  .tbl th:first-child, .tbl td:first-child { text-align:left; white-space:normal; }
  .tbl thead th { color:#555; font-size:13px; }
  .tbl tfoot th { background:#f2f4f7; border-top:2px solid #c9ced6; }
  .dh { font-size:17px; font-weight:800; color:var(--navy); margin-top:6px; }
  .dn { font-weight:700; color:var(--navy); margin:12px 0 2px; }
  .dd { padding:8px 0; border-bottom:1px solid #eee; font-size:15px; line-height:1.45; }
  .dd small { display:block; color:#666; font-size:13px; }
  .card { border:1px solid #c9ced6; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; background:#fafbfc; }
  .card h3 { margin:0; font-size:17px; color:var(--navy); }
  .two { display:flex; gap:10px; } .two > div { flex:1; min-width:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="title">Attendance</h1><small id="sub">AB Building and Co</small></div>

  <!-- Employee login -->
  <div class="in hide" id="vLogin">
    <label for="selName">Select your name</label>
    <select id="selName"></select>
    <label for="inPin">PIN (4 digits)</label>
    <input id="inPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <button class="btn b" id="bLogin">Login</button>
    <div class="err" id="eLogin"></div>
    <div class="muted">Your phone remembers you. No need to log in every day.</div>
  </div>

  <!-- Employee main -->
  <div class="in hide" id="vMain">
    <div class="st" id="stText"></div>
    <div id="startBox" class="hide">
      <label for="inStart">Start time (filled in automatically, you can change it)</label>
      <input id="inStart" type="time">
      <div style="height:12px"></div>
      <button class="btn g" id="bStart">START</button>
    </div>
    <div id="finishBox" class="hide">
      <label for="inFinish" id="lblFinish">Finish time</label>
      <input id="inFinish" type="time">
      <div style="height:12px"></div>
      <label>Break taken?</label>
      <div class="seg" id="segBreak">
        <button data-m="0">None</button><button data-m="30" class="on">30 min</button><button data-m="60">60 min</button>
      </div>
      <div style="height:12px"></div>
      <button class="btn r" id="bFinish">FINISH</button>
    </div>
    <div class="err" id="eMain"></div>
    <div class="ok" id="okMain"></div>
    <!-- Forgot a past day -->
    <button class="ghost" id="bPastOpen">Forgot a day? Add it here</button>
    <div class="card hide" id="pastBox">
      <h3>Add a day you missed</h3>
      <div class="muted" id="pastInfo"></div>
      <div id="pastForm">
        <label for="pDay">Which day?</label>
        <select id="pDay"></select>
        <div style="height:10px"></div>
        <div class="two">
          <div><label for="pStart">Start time</label><input id="pStart" type="time"></div>
          <div><label for="pFinish">Finish time</label><input id="pFinish" type="time"></div>
        </div>
        <div style="height:10px"></div>
        <label>Break taken?</label>
        <div class="seg" data-break="30" id="pBreak">
          <button data-m="0">None</button><button data-m="30" class="on">30 min</button><button data-m="60">60 min</button>
        </div>
        <div style="height:12px"></div>
        <button class="btn b" id="bPastSave">Save this day</button>
      </div>
      <div class="err" id="ePast"></div>
      <button class="link" id="bPastClose">Close</button>
    </div>
    <div>
      <div class="row"><b>This week</b><b id="wkTotal"></b></div>
      <div id="wkDays"></div>
    </div>
    <button class="link" id="bLogout">Not you? Log out</button>
  </div>

  <!-- Owner login -->
  <div class="in hide" id="vOwnerLogin">
    <label for="inOwnerPin">Owner PIN</label>
    <input id="inOwnerPin" type="password" inputmode="numeric" maxlength="12" autocomplete="off">
    <button class="btn b" id="bOwnerLogin">Open</button>
    <div class="err" id="eOwner"></div>
  </div>

  <!-- Owner week -->
  <div class="in hide" id="vOwner">
    <table class="tbl">
      <thead><tr><th>Name</th><th>Normal</th><th>Overtime</th><th>Total</th></tr></thead>
      <tbody id="oRows"></tbody>
      <tfoot><tr><th>All staff</th><th id="oNormal"></th><th id="oOt" class="ot"></th><th id="oTotal"></th></tr></tfoot>
    </table>
    <div class="muted" id="oNote"></div>
    <div class="warn" id="oWarn"></div>
    <div id="oDaysWrap" class="hide">
      <div class="dh">Day by day</div>
      <div id="oDays"></div>
    </div>
    <div class="seg"><button id="bPrev">◀ Prev week</button><button id="bNext">Next ▶</button></div>
    <!-- Owner: add or fix a day for anyone -->
    <div class="card" id="fixBox">
      <h3>Add or fix a day</h3>
      <div class="muted">For the week shown above. This replaces any time already saved for that person on that day.</div>
      <label for="fName">Employee</label>
      <select id="fName"></select>
      <label for="fDay">Day</label>
      <select id="fDay"></select>
      <div class="muted" id="fNow"></div>
      <div class="two">
        <div><label for="fStart">Start time</label><input id="fStart" type="time"></div>
        <div><label for="fFinish">Finish time</label><input id="fFinish" type="time"></div>
      </div>
      <label>Break taken?</label>
      <div class="seg" data-break="30" id="fBreak">
        <button data-m="0">None</button><button data-m="30" class="on">30 min</button><button data-m="60">60 min</button>
      </div>
      <button class="btn b" id="bFixSave">Save</button>
      <div class="err" id="eFix"></div>
      <div class="ok" id="okFix"></div>
    </div>
    <button class="btn b" id="bTest">Email me this report now</button>
    <div class="muted" id="oMsg"></div>
  </div>
</div>

<script>
/* The Google Apps Script web app (data stays in the owner's Google Sheet). */
var API = 'https://script.google.com/macros/s/AKfycbyLKDyBkj1x1e7T37T8Uyx6IuKzh4NwsB8XKRwNWukFbmCUHeNT6LrOA1DFSkVdzqJ5DA/exec';
var MODE = /[?&]owner=1(&|$)/.test(location.search) ? 'owner' : 'staff';
var KEY = 'crewAttendance.v1';
var me = null, ownerPin = null, weekOffset = 0, breakMin = 30;

function $(id) { return document.getElementById(id); }
function show(id) { ['vLogin','vMain','vOwnerLogin','vOwner'].forEach(function (v) { $(v).classList.toggle('hide', v !== id); }); }
function store(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
function nowHHMM() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
/* Hours as easy text, e.g. 8.5 -> "8h 30m", 8 -> "8h", 0.5 -> "30m" */
function hm(n) {
  var m = Math.max(0, Math.round((Number(n) || 0) * 60)), h = Math.floor(m / 60), r = m % 60;
  if (!h && !r) return '0h';
  return (h ? h + 'h' : '') + (h && r ? ' ' : '') + (r ? r + 'm' : '');
}
function h1(n) { return hm(n); }
var touched = { inStart: false, inFinish: false }, forgot = false, confirmLong = false;
function clearMsgs() { ['eLogin','eMain','eOwner'].forEach(function (i) { $(i).textContent = ''; }); $('okMain').textContent = ''; }

/* Calls the server. text/plain keeps it a "simple" request (no CORS preflight), and no Google cookies are sent,
   so it works in any browser no matter how many Google accounts are signed in. */
function api(fn, args, ok, fail) {
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), credentials: 'omit', redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.ok) ok(d.res); else fail({ message: (d && d.error) || '' }); })
    .catch(function () { fail({ message: '' }); });
}
function call(fn, args, ok, errEl, btn) {
  if (btn) btn.disabled = true;
  api(fn, args,
    function (res) { if (btn) btn.disabled = false; ok(res); },
    function (e) { if (btn) btn.disabled = false; $(errEl).textContent = (e && e.message) || 'Something went wrong. Check your internet and try again.'; });
}

/* ---------- Employee ---------- */
function renderStatus(s) {
  $('title').textContent = 'Hi ' + s.name;
  $('sub').textContent = s.todayLabel;
  var open = !!s.open;
  $('stText').innerHTML = '';
  if (open) {
    $('stText').append('Started at: ');
    var b = document.createElement('b'); b.textContent = s.open.start + (s.open.label !== s.todayLabel ? ' (' + s.open.label + ')' : ''); $('stText').append(b);
  } else {
    $('stText').textContent = 'Not started yet';
  }
  $('startBox').classList.toggle('hide', open);
  $('finishBox').classList.toggle('hide', !open);
  forgot = open && s.open.forgot;
  confirmLong = false; $('bFinish').textContent = 'FINISH';
  touched.inStart = false; touched.inFinish = false;
  $('lblFinish').textContent = forgot ? 'You forgot to press FINISH on ' + s.open.label + '. What time did you finish that day?' : 'Finish time';
  $('inStart').value = nowHHMM();
  $('inFinish').value = forgot ? '' : nowHHMM();
  renderPast(s);
  $('wkTotal').textContent = h1(s.week.total);
  var box = $('wkDays'); box.innerHTML = '';
  s.week.days.forEach(function (d) {
    var r = document.createElement('div'); r.className = 'row';
    var a = document.createElement('span'); a.textContent = d.label + '  ' + d.start + ' – ' + (d.finish || '…');
    var c = document.createElement('span'); c.textContent = d.finish ? h1(d.hours) : 'working';
    r.append(a, c); box.append(r);
  });
  show('vMain');
}

/* ---------- Forgot a past day (employee) ---------- */
function segVal(id) { return Number($(id).getAttribute('data-break')); }
function hookSeg(id) {
  Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) {
    b.onclick = function () {
      $(id).setAttribute('data-break', b.getAttribute('data-m'));
      Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (x) { x.classList.toggle('on', x === b); });
    };
  });
}
hookSeg('pBreak'); hookSeg('fBreak');
function fillSelect(sel, items, firstText) {
  var keep = sel.value; sel.innerHTML = '';
  if (firstText) { var o0 = document.createElement('option'); o0.value = ''; o0.textContent = firstText; sel.append(o0); }
  items.forEach(function (it) { var o = document.createElement('option'); o.value = it.value; o.textContent = it.text; sel.append(o); });
  if (items.some(function (it) { return it.value === keep; })) sel.value = keep;
}
function renderPast(s) {
  var p = s.past || { open: false, days: [], note: '' };
  var days = p.days || [];
  fillSelect($('pDay'), days.map(function (d) { return { value: d.date, text: d.label }; }), days.length > 1 ? '— choose a day —' : '');
  var info = p.note || '';
  if (p.open && !days.length) info = 'Every day this week already has a time. ' + info;
  $('pastInfo').textContent = info;
  $('pastForm').classList.toggle('hide', !p.open || !days.length);
}
$('bPastOpen').onclick = function () { $('pastBox').classList.remove('hide'); $('bPastOpen').classList.add('hide'); $('ePast').textContent = ''; };
$('bPastClose').onclick = function () { $('pastBox').classList.add('hide'); $('bPastOpen').classList.remove('hide'); };
$('bPastSave').onclick = function () {
  clearMsgs(); $('ePast').textContent = '';
  var day = $('pDay').value, st = $('pStart').value, fi = $('pFinish').value;
  if (!day) { $('ePast').textContent = 'Please choose the day.'; return; }
  if (!st || !fi) { $('ePast').textContent = 'Please enter both start and finish time.'; return; }
  var worked = mins(fi) - mins(st); if (worked <= 0) worked += 1440; worked -= segVal('pBreak');
  if (worked <= 0) { $('ePast').textContent = 'Please check the times.'; return; }
  var label = $('pDay').options[$('pDay').selectedIndex].textContent;
  if (!confirm('Save ' + label + ': ' + st + ' to ' + fi + ' (' + hm(worked / 60) + ')?\nYou cannot change it later.')) return;
  call('addPastDay', [me.name, me.pin, day, st, fi, segVal('pBreak')], function (s) {
    $('pStart').value = ''; $('pFinish').value = '';
    renderStatus(s);
    $('pastBox').classList.add('hide'); $('bPastOpen').classList.remove('hide');
    $('okMain').textContent = 'Saved ' + label + ': ' + h1(s.savedHours || 0);
  }, 'ePast', this);
};

function refresh() { call('getMyStatus', [me.name, me.pin], renderStatus, 'eMain'); }

/* Keep the pre-filled time current until the employee changes it themselves */
['inStart', 'inFinish'].forEach(function (id) {
  $(id).addEventListener('input', function () { touched[id] = true; if (confirmLong) { confirmLong = false; $('bFinish').textContent = 'FINISH'; $('eMain').textContent = ''; } });
});
function tickTimes() {
  if (!touched.inStart) $('inStart').value = nowHHMM();
  if (!touched.inFinish && !forgot) $('inFinish').value = nowHHMM();
}
setInterval(tickTimes, 20000);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  tickTimes();
  if (me && !$('vMain').classList.contains('hide') && !touched.inStart && !touched.inFinish && !confirmLong) refresh();
});
window.addEventListener('focus', tickTimes);
/* '' = let the server use the real time now */
function timeToSend(id) { return (touched[id] || (id === 'inFinish' && forgot)) ? $(id).value : ''; }
function mins(t) { var p = (t || '').split(':'); return p.length < 2 ? NaN : (+p[0]) * 60 + (+p[1]); }

$('bLogin').onclick = function () {
  clearMsgs();
  var name = $('selName').value, pin = $('inPin').value.trim();
  if (!name || !pin) { $('eLogin').textContent = 'Please select your name and enter your PIN.'; return; }
  call('login', [name, pin], function (s) { me = { name: name, pin: s.cred }; store(me); renderStatus(s); }, 'eLogin', this);
};
$('bStart').onclick = function () {
  clearMsgs();
  if (touched.inStart && !$('inStart').value) { $('eMain').textContent = 'Please enter your start time.'; return; }
  call('clockIn', [me.name, me.pin, timeToSend('inStart')], function (s) { renderStatus(s); $('okMain').textContent = 'Started. Have a safe day!'; }, 'eMain', this);
};
$('bFinish').onclick = function () {
  clearMsgs();
  var fin = $('inFinish').value;
  if (!fin) { $('eMain').textContent = 'Please enter your finish time.'; return; }
  var startEl = $('stText').querySelector('b');
  var st = startEl ? startEl.textContent.slice(0, 5) : '';
  var worked = mins(fin) - mins(st); if (worked < 0) worked += 1440; worked -= breakMin;
  if (worked > 14 * 60 && !confirmLong) {
    confirmLong = true;
    $('eMain').textContent = 'That is ' + (worked / 60).toFixed(1) + ' hours (' + st + ' to ' + fin + '). Please check the time. If it is correct, press FINISH again.';
    $('bFinish').textContent = 'YES, FINISH';
    return;
  }
  confirmLong = false; $('bFinish').textContent = 'FINISH';
  call('clockOut', [me.name, me.pin, timeToSend('inFinish'), breakMin], function (s) {
    renderStatus(s);
    $('okMain').textContent = 'Finished. Hours: ' + h1(s.finishedHours || 0);
  }, 'eMain', this);
};
Array.prototype.forEach.call(document.querySelectorAll('#segBreak button'), function (b) {
  b.onclick = function () {
    breakMin = Number(b.getAttribute('data-m'));
    Array.prototype.forEach.call(document.querySelectorAll('#segBreak button'), function (x) { x.classList.toggle('on', x === b); });
  };
});
$('bLogout').onclick = function () { store(null); me = null; $('inPin').value = ''; $('title').textContent = 'Attendance'; startStaff(); };

function startStaff() {
  call('getAppInfo', [], function (info) {
    $('title').textContent = 'Attendance';
    $('sub').textContent = info.company;
    var sel = $('selName'); sel.innerHTML = '';
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '— choose —'; sel.append(o0);
    info.names.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sel.append(o); });
    var saved = load();
    if (saved && info.names.indexOf(saved.name) >= 0) {
      me = saved;
      api('getMyStatus', [me.name, me.pin], renderStatus, function (e) {
        var msg = (e && e.message) || '';
        if (/Wrong name or PIN/.test(msg)) { store(null); me = null; $('eLogin').textContent = 'Please log in again.'; }
        else $('eLogin').textContent = msg || 'Something went wrong. Check your internet and try again.';
        show('vLogin');
      });
    } else {
      show('vLogin');
    }
  }, 'eLogin');
  show('vLogin');
}

/* ---------- Owner ---------- */
function renderWeek(w) {
  weekOffset = w.offset;
  $('title').textContent = 'Weekly hours';
  $('sub').textContent = (w.company || 'AB Building and Co') + ' · ' + w.label;
  var box = $('oRows'); box.innerHTML = '';
  var warns = [];
  var n2 = hm;
  w.rows.forEach(function (p) {
    var r = document.createElement('tr');
    [p.name, n2(p.normal), p.ot > 0 ? n2(p.ot) : '–', n2(p.hours)].forEach(function (v, i) {
      var td = document.createElement('td'); td.textContent = v; if (i === 2 && p.ot > 0) td.className = 'ot'; r.append(td);
    });
    box.append(r);
    p.warnings.forEach(function (x) { warns.push('⚠ ' + p.name + ': ' + x); });
  });
  $('oNormal').textContent = n2(w.totalNormal);
  $('oOt').textContent = n2(w.totalOt);
  $('oNote').textContent = 'Overtime = time over ' + w.otAfter + ' hours in one day.';
  var dbox = $('oDays'); dbox.innerHTML = ''; var anyDays = false;
  w.rows.forEach(function (p) {
    if (!p.dayList || !p.dayList.length) return;
    anyDays = true;
    var n = document.createElement('div'); n.className = 'dn'; n.textContent = p.name; dbox.append(n);
    p.dayList.forEach(function (d) {
      var r = document.createElement('div'); r.className = 'dd';
      var top = document.createElement('div');
      top.append(d.label + ':  ');
      var b = document.createElement('b'); b.textContent = hm(d.hours); top.append(b);
      if (d.ot > 0) {
        top.append('  (Normal ' + hm(d.normal) + ' + ');
        var o = document.createElement('span'); o.className = 'ot'; o.textContent = 'Overtime ' + hm(d.ot); top.append(o, ')');
      }
      var sm = document.createElement('small'); sm.textContent = d.times;
      r.append(top, sm); dbox.append(r);
    });
  });
  $('oDaysWrap').classList.toggle('hide', !anyDays);
  (w.problems || []).forEach(function (x) { warns.push('⚠ ' + x); });
  $('oWarn').textContent = ''; warns.forEach(function (x) { var d = document.createElement('div'); d.textContent = x; $('oWarn').append(d); });
  $('oTotal').textContent = n2(w.total);
  $('bNext').disabled = w.offset === 0;
  renderFix(w);
  show('vOwner');
}
/* ---------- Owner: add or fix a day ---------- */
var lastWeek = null;
function renderFix(w) {
  lastWeek = w;
  fillSelect($('fName'), (w.names || []).map(function (n) { return { value: n, text: n }; }), '— choose —');
  fillSelect($('fDay'), (w.dates || []).map(function (d) { return { value: d.date, text: d.label }; }), '— choose —');
  showFixNow();
}
function showFixNow() {
  var n = $('fName').value, d = $('fDay').value, txt = '';
  if (n && d && lastWeek) {
    lastWeek.rows.forEach(function (p) {
      if (p.name !== n) return;
      (p.dayList || []).forEach(function (x) { if (x.date === d) txt = 'Saved now: ' + x.times + ' (' + hm(x.hours) + ')'; });
    });
    if (!txt) txt = 'Nothing saved for this day yet.';
  }
  $('fNow').textContent = txt;
}
$('fName').onchange = showFixNow; $('fDay').onchange = showFixNow;
$('bFixSave').onclick = function () {
  $('eFix').textContent = ''; $('okFix').textContent = '';
  var n = $('fName').value, d = $('fDay').value, st = $('fStart').value, fi = $('fFinish').value;
  if (!n || !d) { $('eFix').textContent = 'Please choose the employee and the day.'; return; }
  if (!st || !fi) { $('eFix').textContent = 'Please enter both start and finish time.'; return; }
  var worked = mins(fi) - mins(st); if (worked <= 0) worked += 1440; worked -= segVal('fBreak');
  if (worked <= 0) { $('eFix').textContent = 'Please check the times.'; return; }
  var label = $('fDay').options[$('fDay').selectedIndex].textContent;
  if (!confirm('Save for ' + n + ', ' + label + ': ' + st + ' to ' + fi + ' (' + hm(worked / 60) + ')?')) return;
  call('ownerSetDay', [ownerPin, n, d, st, fi, segVal('fBreak'), weekOffset], function (w) {
    $('fStart').value = ''; $('fFinish').value = '';
    renderWeek(w);
    $('okFix').textContent = 'Saved for ' + n + ', ' + label + '.';
  }, 'eFix', this);
};
function loadWeek(off) { $('oMsg').textContent = 'Loading…'; call('getOwnerWeek', [ownerPin, off], function (w) { $('oMsg').textContent = ''; renderWeek(w); }, 'oMsg'); }
$('bOwnerLogin').onclick = function () {
  clearMsgs();
  var p = $('inOwnerPin').value.trim();
  call('getOwnerWeek', [p, 0], function (w) { ownerPin = p; renderWeek(w); }, 'eOwner', this);
};
$('bPrev').onclick = function () { loadWeek(weekOffset + 1); };
$('bNext').onclick = function () { if (weekOffset > 0) loadWeek(weekOffset - 1); };
$('bTest').onclick = function () {
  $('oMsg').textContent = 'Sending…';
  call('sendReportNow', [ownerPin, weekOffset], function () { $('oMsg').textContent = 'Email sent. Check your inbox (and Spam the first time).'; }, 'oMsg', this);
};

if (MODE === 'owner') { $('title').textContent = 'Owner'; $('sub').textContent = 'AB Building and Co · Weekly hours'; show('vOwnerLogin'); }
else startStaff();
</script>
</body>
</html>
